services:
  postgres:
    image: ${REGISTRY}/supermarket-scraper-db:${IMAGE_TAG:-latest}
    container_name: supermarket-scraper-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      # Persist data
      - postgres_data:/var/lib/postgresql/data
    restart: always

  scraper-api:
    image: ${REGISTRY}/supermarket-scraper-api:${IMAGE_TAG:-latest}
    container_name: supermarket-scraper-api
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      API_PORT: 3001
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      CATALOG_ENABLED: ${CATALOG_ENABLED:-true}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    volumes:
      # Mount logs directory for persistence
      - ./logs:/app/logs
    # Joined to shelly-network so the Baskit web container can proxy
    # /api/discounts to http://supermarket-scraper-api:3001/api/public/v1
    networks:
      - shelly-network
      - default
    labels:
      # /api goes from Traefik straight to this API, never through the web
      # nginx: on shelly-network "scraper-api" is also the acc API, so nginx
      # would reach either stack.
      - "traefik.enable=true"
      - "traefik.docker.network=shelly-network"
      - "traefik.http.routers.supermarkets-api.rule=Host(`supermarkets.shelly-nas.nl`) && PathPrefix(`/api`)"
      - "traefik.http.routers.supermarkets-api.entrypoints=web"
      - "traefik.http.services.supermarkets-api.loadbalancer.server.port=3001"

  web:
    image: ${REGISTRY}/supermarket-scraper-web:${IMAGE_TAG:-latest}
    container_name: supermarket-scraper-web
    ports:
      - "8090:80"
    depends_on:
      - scraper-api
    restart: always
    networks:
      - shelly-network
      - default
    labels:
      - "traefik.enable=true"
      # Two networks: tell Traefik which one to use, or it may answer 504.
      - "traefik.docker.network=shelly-network"
      - "traefik.http.routers.supermarkets.rule=Host(`supermarkets.shelly-nas.nl`)"
      - "traefik.http.routers.supermarkets.entrypoints=web"
      - "traefik.http.services.supermarkets.loadbalancer.server.port=80"

volumes:
  postgres_data:
    driver: local

networks:
  shelly-network:
    external: true
